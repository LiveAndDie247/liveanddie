<head>

<style>
@font-face{font-family:"Web437 VGA";src:url("/gate/fonts/Web437_IBM_VGA_8x16.woff") format("woff");font-weight:normal;font-style:normal;font-display:block}
:root{--red:#ff3030;--blue:#4070ff;--dim:#802020;--mono:"Web437 VGA","Cascadia Mono","DejaVu Sans Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000}
body{color:var(--red);font:16px/1.25 var(--mono);letter-spacing:0;
  -webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed;
  overscroll-behavior:none;-webkit-text-size-adjust:100%}
::selection{background:var(--blue);color:#000}
#term{position:fixed;inset:0 0 var(--barh,44px) 0;overflow-y:auto;overflow-x:hidden;
  padding:10px 10px 4px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
#out,#out .ln{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.logo,.art{white-space:pre!important;overflow-wrap:normal!important;word-break:normal!important;overflow-x:auto}
.ln{margin:0}
.dim{color:var(--dim)}
.blue{color:var(--blue)}
a,a:visited{color:var(--blue);text-decoration:none;cursor:pointer}
a:hover,a:active{background:var(--blue);color:#000}
a.cmd::before{content:""}
.pr{color:var(--blue)}
.bar[data-seek]{cursor:pointer}
body.nocrt::after{display:none}
#prompt{display:flex;align-items:baseline;gap:0}
#prompt .ps1{color:var(--blue);white-space:pre}
#prompt form{flex:1;display:flex;min-width:0}
#cmd{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--red);
  font:inherit;letter-spacing:0;caret-color:transparent;padding:0}
.cur{display:inline-block;width:0.6em;height:1.05em;background:var(--blue);vertical-align:text-bottom;
  animation:bl 1.06s steps(1) infinite;margin-left:1px}
@keyframes bl{50%{opacity:0}}
.logo{color:var(--red);white-space:pre;display:block;margin:0 0 2px}
.art{line-height:1;white-space:pre;display:block;margin:2px 0}
.art span{display:inline}
.bar{color:var(--dim)}
#cmdbar{position:fixed;left:0;right:0;bottom:0;height:var(--barh,44px);display:flex;gap:4px;
  padding:5px 6px;background:#000;border-top:1px solid var(--dim);overflow-x:auto}
#cmdbar button{flex:0 0 auto;font:inherit;background:#000;color:var(--blue);border:1px solid var(--dim);
  padding:4px 8px;cursor:pointer;white-space:nowrap}
#cmdbar button:active{background:var(--blue);color:#000}
#viewer{position:fixed;inset:0;z-index:40;background:#000;display:none;flex-direction:column}
#viewer.on{display:flex}
#viewer .top{padding:8px 10px;border-bottom:1px solid var(--dim);color:var(--blue)}
#viewer .top a{color:var(--blue)}
#viewer .pic{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:8px}
#viewer .pic .ovl{position:relative;display:inline-block;max-width:100%}
#viewer .pic .ovl::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;background:url(/img/wm.svg) 0 0/220px auto repeat}
#viewer img{max-width:100%;max-height:100%;display:block;image-rendering:auto}
body::after{content:"";position:fixed;inset:0;z-index:30;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 3px);animation:flick 7s steps(1) infinite}
@keyframes flick{0%,97%,100%{opacity:1}98%{opacity:.82}99%{opacity:.94}}
body::before{content:"";position:fixed;inset:0;z-index:29;pointer-events:none;
  background:radial-gradient(ellipse 120% 120% at 50% 50%,transparent 62%,rgba(0,0,0,.55) 100%)}
body.nocrt::before,body.nocrt::after{display:none}
@media(prefers-reduced-motion:reduce){.cur{animation:none}body::after{display:none;animation:none}}
</style>
</head>
<body>
<div id="term"><div id="out" role="log" aria-live="polite" aria-label="terminal output"></div>
<div id="prompt" style="display:none"><span class="ps1">visitor@live.and.die:~$ </span><form autocomplete="off"><input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="terminal input" enterkeyhint="go"></form><span class="cur" id="cur"></span></div>
</div>
<nav id="cmdbar" aria-label="commands">
<button data-cmd="&#9;">tab</button><button data-cmd="help">help</button><button data-cmd="ls">ls</button><button data-cmd="music">music</button><button data-cmd="art">art</button><button data-cmd="neofetch">neofetch</button><button data-cmd="top">top</button><button data-cmd="theme">theme</button><button data-cmd="commissions">commissions</button><button data-cmd="links">links</button><button data-cmd="clear">clear</button></nav>
<div id="viewer" aria-hidden="true"><div class="top"><a id="vclose" href="#">[ x ] close</a> <span id="vttl" class="dim"></span></div><div class="pic"><span class="ovl"><img id="vimg" alt=""></span></div></div>

</body>
</html>
