<script>(function(){var T=["5333", "3602", "4571", "2817", "9010", "1328"];var c=document.getElementById("c"),g=c.getContext("2d"),W,H,mx=-1e4,my=-1e4,f=0,cell=110;function sz(){W=c.width=innerWidth;H=c.height=innerHeight;cell=W<600?90:120}addEventListener("resize",sz);sz();addEventListener("pointermove",function(e){mx=e.clientX;my=e.clientY},{passive:true});var ang={};function draw(){f++;g.fillStyle="#000";g.fillRect(0,0,W,H);var cols=Math.ceil(W/cell),rows=Math.ceil(H/cell);for(var j=0;j<rows;j++)for(var i=0;i<cols;i++){var cx=i*cell+cell/2,cy=j*cell+cell/2,d=Math.hypot(mx-cx,my-cy),sp=0.01+2/(1+d/40);var k=j*cols+i;ang[k]=(ang[k]||k)+sp*0.05;var a=ang[k],b=ang[k]*0.7,s=cell*0.28,P=[];for(var n=0;n<8;n++){var x=(n&1?1:-1),y=(n&2?1:-1),z=(n&4?1:-1);var x1=x*Math.cos(a)-z*Math.sin(a),z1=x*Math.sin(a)+z*Math.cos(a);var y1=y*Math.cos(b)-z1*Math.sin(b);z1=y*Math.sin(b)+z1*Math.cos(b);var q=2.6/(3.6+z1);P.push([cx+x1*s*q,cy+y1*s*q]);}g.strokeStyle=d<cell?"#3a3aff":"#ff0000";g.beginPath();for(var p=0;p<8;p++)for(var r=p+1;r<8;r++){var e=p^r;if(e===1||e===2||e===4){g.moveTo(P[p][0],P[p][1]);g.lineTo(P[r][0],P[r][1]);}}g.stroke();}}setInterval(draw,40);c.addEventListener("click",function(e){var cols=Math.ceil(W/cell);var k=Math.floor(e.clientY/cell)*cols+Math.floor(e.clientX/cell);location.href=T[k%T.length]+".html";});})();</script>
